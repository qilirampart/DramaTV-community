spring:
  application:
    name: dramatv-community-server
  profiles:
    default: local-db
  datasource:
    url: ${DRAMATV_DB_URL:jdbc:postgresql://127.0.0.1:5432/dramatv}
    username: ${DRAMATV_DB_USERNAME:dramatv}
    password: ${DRAMATV_DB_PASSWORD:dramatv}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${DRAMATV_REDIS_HOST:127.0.0.1}
      port: ${DRAMATV_REDIS_PORT:6379}

server:
  port: ${DRAMATV_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

dramatv:
  logging:
    dir: ${DRAMATV_LOG_DIR:logs/server}
  media:
    local-dir: ${DRAMATV_MEDIA_LOCAL_DIR:tmp/media}

logging:
  level:
    root: INFO
    com.dramatv.community: INFO
    com.dramatv.community.access: INFO
